<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Emotion Detection</title>
    <style>
        body {
            background: #ffffff;
            color: #111111;
            font-family: Arial, Helvetica, sans-serif;
            margin: 40px;
        }
        .center-heading {
            text-align: center;
        }
        .center {
            text-align: center;
            margin-top: 20px;
        }
        textarea {
            width: 70%;
            height: 120px;
            font-size: 16px;
            padding: 10px;
        }
        button {
            padding: 10px 18px;
            font-size: 16px;
            cursor: pointer;
        }
        #system_response {
            text-align: center;
            margin-top: 16px;
            font-size: 18px;
            max-width: 900px;
            margin-left: auto;
            margin-right: auto;
        }
    </style>
    <script src="/static/mywebscript.js"></script>
</head>
<body>
    <h1 class="center-heading">NLP Emotion Detection on AI Platform</h1>
    <div class="center">
        <label for="textToAnalyze">
            Enter text to be analyzed for emotion detection:
        </label>
        <br><br>
        <textarea id="textToAnalyze" rows="4" cols="50"
            placeholder="Type your text here..."></textarea>
        <br><br>
        <button onclick="RunSentimentAnalysis()">Run Emotion Detection</button>
        <br><br>
        <h2 class="center-heading">Result of Emotion Detection</h2>
        <p id="system_response"></p>
    </div>
</body>
</html>
